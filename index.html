'use strict';
const $=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='home';
function button(t,act,id='',extra=''){return `<button class="button ${extra}" data-action="${act}" ${id?`data-id="${E(id)}"`:''}>${t}</button>`}
function open(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}function close(){$('#dialog').close();$('#dialog-body').replaceChildren()}$('#dialog-close').onclick=close;
function board(){return `<section class="wrap section"><div class="eyebrow">COMMUNITY PROPOSALS</div><h1>함께할 협력을 발견하세요.</h1><p>신청자가 공개를 선택하고 총괄이 승인한 제안 요약을 안내할 공간입니다.</p><div class="empty">온라인 접수 연결 후 승인된 제안을 이곳에서 안내할 예정입니다.</div><p class="hint">현재 등록된 공개 제안은 없습니다. 개인정보나 비공개 제안은 게시하지 않습니다.</p>${button('협력사업 보기','home','','outline')}</section>`}
function guide(){return `<section class="wrap section"><div class="eyebrow">이용 안내</div><h1>기업·기관·소상공인과 함께합니다.</h1><div class="faqs"><details open><summary>어떤 협력을 제안할 수 있나요?</summary><p>교육·역량 강화, 독서·문화예술, 공간·자원 공유, 지역상생 공동사업 등 필요한 협력을 제안할 수 있도록 준비하고 있습니다. 구체적인 지원 범위와 일정은 사업별 검토를 통해 결정합니다.</p></details><details open><summary>지금 온라인으로 신청할 수 있나요?</summary><p>현재는 사업 안내를 제공하며 온라인 접수와 로그인은 준비 중입니다. 접수 창구가 연결되면 이 페이지에서 안내하겠습니다.</p></details><details><summary>제안 내용이 바로 공개되나요?</summary><p>운영 계획상 신청자가 선택한 공개 범위와 총괄 검토·승인을 거쳐 요약만 공개합니다. 회신 연락처와 비공개 상세는 게시하지 않습니다.</p></details><details><summary>연결 의사 수는 무엇인가요?</summary><p>공단 직원이 제안에 협력 의사를 표시한 수를 안내하는 기능을 준비하고 있습니다. 실제 매칭 확정이나 지원 보장을 의미하지는 않습니다.</p></details></div></section>`}
function ready(action){const title=action==='login'?'로그인 준비 중':'온라인 접수 준비 중';open(title,`<h2>${title}</h2><p>온라인 접수·신청내역 관리 기능을 준비하고 있습니다. 접수 창구가 연결되면 이 페이지에서 안내하겠습니다.</p><p>지금은 협력사업과 참여 절차를 살펴보실 수 있습니다.</p><div class="actions">${button('사업 안내 보기','return-home','','outline')}${button('확인','close')}</div>`)}
function render(){$('#app').innerHTML=({home,board,guide}[view])();document.querySelectorAll('nav [data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===view))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close')return close();if(['home','board','guide','return-home'].includes(a)){if($('#dialog').open)close();view=a==='return-home'?'home':a;render();window.scrollTo({top:0,behavior:'smooth'});return}ready(a)});
