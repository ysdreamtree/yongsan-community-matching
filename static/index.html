const $=x=>document.querySelector(x),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const F=['교육·역량 강화','독서·문화예술','공간·자원 공유','지역상생 공동사업','기타'];const S=['접수','내용 확인','부서 검토','협의 중','실행 예정','실행 완료','보완 요청','보류','연계 어려움','신청 철회'];let user=null,view='home',payload={items:[]},csrf='';let timer;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,5000)}
async function api(path,data){const opts={credentials:'same-origin'};if(data!==undefined){opts.method='POST';opts.headers={'Content-Type':'application/json','X-CSRF-Token':csrf};opts.body=JSON.stringify(data)}const r=await fetch('/api/'+path,opts);const out=await r.json();if(!r.ok)throw Error(out.error||'요청을 처리하지 못했습니다.');return out}
function open(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}function close(){$('#dialog').close();$('#dialog-body').innerHTML=''}$('#dialog-close').onclick=close;
function field(label,name,val='',opts={}){return `<label class="field ${opts.full?'full':''}">${label}${opts.required?' *':''}${opts.textarea?`<textarea name="${name}" maxlength="${opts.max||1000}" ${opts.required?'required':''}>${E(val)}</textarea>`:`<input name="${name}" type="${opts.type||'text'}" value="${E(val)}" maxlength="${opts.max||120}" ${opts.required?'required':''}>`}</label>`}function select(label,name,options,val){return `<label class="field">${label}<select name="${name}">${options.map(x=>`<option ${x===val?'selected':''}>${E(x)}</option>`).join('')}</select></label>`}function button(t,act,id='',extra=''){return `<button class="button ${extra}" data-action="${act}" ${id?`data-id="${E(id)}"`:''}>${t}</button>`}
function session(){const box=$('#session');box.innerHTML=user?`<b>${E(user.org||user.dept||'공단')} · ${E(user.alias)}</b><small>${{applicant:'참여자',staff:'공단 직원',admin:'총괄 담당자'}[user.role]}</small>${button('로그아웃','logout','','outline small')}`:`<b>방문자</b><small>공개 제안을 자유롭게 확인할 수 있습니다.</small>${button('간편 로그인','login','','outline small')}${button('처음 이용하기','register','','small')}`}
async function navigate(dest){view=dest;try{if(dest==='board')payload=await api('public');else if(dest==='mine'&&user?.role==='applicant')payload=await api('mine');else if(dest==='work'&&['staff','admin'].includes(user?.role))payload=await api(user.role);else payload={items:[]};render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast(e.message)}}
function render(){session();$('#app').innerHTML=({home,board,mine,work}[view]||home)()}
function home(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="platform-name"><span>용산구시설관리공단</span><strong>지역상생 협력 매칭 플랫폼</strong></div><h1>우리 기업·기관에 필요한 협력,<br>공단과 함께 찾아보세요.</h1><p>지역의 필요와 공단의 자원을 연결합니다.<br>사업을 살펴보고, 함께할 협력을 제안해 주세요.</p>${button('공개 제안 살펴보기 ↗','board','','orange')}<div class="hero-note">협력 제안 → 총괄 검토 → 담당자 연결 → 협의·실행</div></div><div class="action-panel"><h3>어떻게 참여하시겠어요?</h3><button class="entry" data-action="apply"><span>01</span><span><b>우리 기업·기관 협력 신청</b><small>필요한 활동과 함께할 자원을 제안해 주세요.</small></span><i>↗</i></button><button class="entry" data-action="recommend"><span>02</span><span><b>기업·기관·소상공인 추천</b><small>공식 홈페이지와 추천 이유를 알려주세요.</small></span><i>↗</i></button><div class="panel-bottom">사업을 정하지 않아도 제안할 수 있습니다. 회신 연락처는 공개하지 않습니다.</div></div></div></section><section class="wrap section"><div class="heading"><div><div class="eyebrow">협력사업 안내</div><h2>함께할 사업을 찾아보세요.</h2></div><p>지원 범위·일정은 사업 담당자 확인 후 결정합니다.</p></div><div class="program-list">${program('독서경영','독서·학습','기관 안에 책 읽는 문화를 만들고 싶다면','독서모임 운영 경험 공유 · 독서문화 활동 연계')}${program('예술로','문화·예술','지역의 이야기를 예술 활동으로 풀어내고 싶다면','지역 이야기 발굴 · 주민 참여 예술 활동')}</div><div class="free-entry"><div><div class="eyebrow">사업 미지정 · 자유 제안</div><h3>찾는 사업이 없으신가요?</h3><p>필요한 협력 분야와 해결하고 싶은 과제를 알려주세요.</p></div>${button('자유롭게 제안하기 ↗','apply','','outline')}</div></section><section class="process"><div class="wrap section"><div class="eyebrow">참여 절차</div><h2>제안부터 실행까지, 함께 이어갑니다.</h2><div class="steps">${[['기업·기관 제안','필요한 협력과 공개할 요약 작성'],['총괄 확인·승인','공개 범위와 관련 사업 검토'],['직원 연결 의사','담당자가 연계 아이디어 전달'],['협의·실행','총괄이 연결하고 결과 확인']].map((x,i)=>`<article><small>STEP 0${i+1}</small><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div><p class="hint">연결 의사 수는 매칭 확정이나 지원 보장을 의미하지 않습니다.</p></div></section>`}
function program(n,c,lead,desc){return `<article class="program"><div class="program-art ${n==='예술로'?'art':''}"><small>${E(c)}</small><strong>${n==='예술로'?'예술로 만나는<br>지역의 가능성':'책과 함께,<br>지역과 함께.'}</strong></div><div><span class="tag">${E(c)}</span><span class="muted"> 연계 검토 예시</span><h3>${E(n)}</h3><p><b>${E(lead)}</b></p><p>${E(desc)}</p></div><div class="program-actions"><small>대상·지원 범위 확인 필요</small>${button('관심 등록','interest',n,'outline')}${button('협력 신청 ↗','apply',n)}</div></article>`}
function board(){return `<section class="wrap section"><div class="heading"><div><div class="eyebrow">COMMUNITY PROPOSALS</div><h1>함께할 협력을 발견하세요.</h1><p>신청자가 공개를 선택하고 총괄이 승인한 요약을 표시합니다.</p></div>${button('협력 제안 +','apply')}</div><div class="board-grid">${payload.items.map(r=>`<article class="proposal-card"><div><span class="tag">${E(r.field)}</span> <span class="tag">${E(r.status)}</span></div><h3>${E(r.title)}</h3><div class="proposal-meta">${E(r.name)} · ${E(r.timing||'일정 협의')}</div><p>${E(r.summary)}</p><div class="card-foot"><span>연결 의사 <b class="count">${r.count}명</b></span>${user?.role==='staff'?button('매칭 신청','match',r.id,'outline small'):''}</div></article>`).join('')}</div>${payload.items.length?'':'<div class="empty">공개 승인된 제안이 없습니다.</div>'}<p class="hint">연결 의사 수는 실제 매칭 확정이나 지원을 의미하지 않습니다.</p></section>`}
function mine(){if(user?.role!=='applicant')return `<section class="wrap section"><h1>내 신청내역</h1><p>발급받은 ID와 인증키로 로그인해 주세요.</p>${button('간편 로그인','login')}${button('처음 이용하기','register','','outline')}</section>`;return `<section class="wrap section"><div class="heading"><div><div class="eyebrow">MY REQUESTS</div><h1>내 신청내역</h1><p>${E(user.org)} · ${E(user.alias)}</p></div>${button('새 협력 제안 +','apply')}</div><div class="notice">공개 신청은 총괄 승인 후 게시됩니다. 신청을 수정하면 다시 승인을 받습니다.</div>${payload.items.map(r=>`<div class="record"><div>${E(r.kind)} · ${E(r.id)} · ${E(r.status)} · ${r.want_public?(r.approved?'공개 중':'공개 승인 대기'):'비공개'}</div><h3>${E(r.title)}</h3><p>회신 안내: ${E(r.reply||'검토 중')}</p><div class="inline-actions">${r.status!=='신청 철회'?button('수정','edit',r.id,'outline small')+button('공개 철회','unpublish',r.id,'outline small')+button('신청 철회','withdraw',r.id,'outline small'):''}</div></div>`).join('')||'<div class="empty">아직 신청내역이 없습니다.</div>'}</section>`}
function work(){if(!user||!['admin','staff'].includes(user.role))return `<section class="wrap section"><h1>직원·총괄 업무 공간</h1><p>발급받은 직원 ID와 인증키로 로그인해 주세요.</p>${button('직원 로그인','login')}</section>`;if(user.role==='staff')return `<section class="wrap section"><div class="heading"><div><div class="eyebrow">STAFF WORKSPACE</div><h1>함께할 제안을 찾아보세요.</h1><p>${E(user.alias)} · ${E(user.dept)}</p></div>${button('공개 제안 보기 ↗','board')}</div><h2>연결 의사 또는 배정 제안</h2>${payload.items.map(r=>`<div class="record"><span class="tag">${E(r.status)}</span><h3>${E(r.title)}</h3>${r.assigned?`<p>배정된 제안 · ${E(r.applicant.org)} · 회신 창구: ${E(r.applicant.contact)}</p><p>비공개 상세: ${E(r.details)}</p>${button('진행 기록 전달','note',r.id,'outline small')}`:`<p>${E(r.summary)}</p>`}${button('연결 의사 철회','unmatch',r.id,'outline small')}</div>`).join('')||'<div class="empty">관심을 표시하거나 배정받은 제안이 없습니다.</div>'}</section>`;return `<section class="wrap section"><div class="heading"><div><div class="eyebrow">COORDINATION DESK</div><h1>제안과 연결을 관리합니다.</h1><p>공개 범위를 확인하고, 직원 연결 의사와 진행 현황을 관리합니다.</p></div>${button('월별 공유 목록 ↓','export','','outline')}</div><div class="stats"><div><small>전체 제안</small><b>${payload.items.length}</b></div><div><small>공개 승인 대기</small><b>${payload.items.filter(x=>x.want_public&&!x.approved&&x.status!=='신청 철회').length}</b></div><div><small>연결 의사</small><b>${payload.items.reduce((n,x)=>n+x.interests.length,0)}</b></div><div><small>실행 완료</small><b>${payload.items.filter(x=>x.status==='실행 완료').length}</b></div></div><h2>접수 및 매칭 관리</h2>${payload.items.map(r=>`<div class="record"><span class="tag">${E(r.status)}</span> <span class="muted">${E(r.id)} · ${E(r.org)}</span><h3>${E(r.title)}</h3><p>${r.want_public?(r.approved?'공개 중':'공개 승인 대기'):'비공개'} · 연결 의사 ${r.interests.length}명 · 배정 ${r.assigned.length}명</p>${button('검토·배정','review',r.id,'outline small')}</div>`).join('')||'<div class="empty">접수된 제안이 없습니다.</div>'}<h2 style="margin-top:30px">직원 계정</h2>${payload.staff.map(s=>`<div class="record"><b>${E(s.alias)}</b> · ${E(s.dept)} · ${s.active?'승인됨':'중지됨'} ${button(s.active?'승인 해제':'승인','staff-toggle',s.id,'outline small')}</div>`).join('')||'<p>발급된 직원 계정이 없습니다.</p>'}</section>`}
function formHandler(id,handler){$('#'+id).onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await handler(new FormData(e.target))}catch(err){toast(err.message)}finally{button.disabled=false}}}
function login(){open('간편 로그인',`<h2>로그인</h2><p>발급받은 ID와 인증키를 입력하세요.</p><form id="login-form"><div class="form-grid">${field('로그인 ID','id','',{required:true,full:true})}${field('인증키','key','',{required:true,type:'password',full:true})}</div><button class="button">로그인</button></form>`);formHandler('login-form',async d=>{await api('login',{id:d.get('id'),key:d.get('key')});const session=await api('session');user=session.user;csrf=user.csrf;close();await navigate(user.role==='applicant'?'mine':'work');toast('로그인했습니다.')})}
async function register(){const result=await api('notice');const notice=result.notice;open('처음 이용하기',`<h2>간편 이용 정보 발급</h2><p>회신 창구는 공개되지 않습니다.</p>${notice?`<div class="notice" style="white-space:pre-wrap">${E(notice.text)}</div>`:'<div class="notice warning">공단의 개인정보 수집·이용 안내와 운영 환경 검토가 필요합니다. 현재 계정 발급이 중지되어 있습니다.</div>'}<form id="register-form"><div class="form-grid">${field('기업·기관·상호명','org','',{required:true,full:true})}${field('담당자 별칭','alias','',{required:true})}${field('비공개 회신 창구','contact','',{required:true})}</div><label class="check"><input type="checkbox" required>위 개인정보 안내를 확인합니다.</label><button class="button" ${notice?'':'disabled'}>ID·인증키 발급</button></form>`);formHandler('register-form',async d=>{let r=await api('register',{org:d.get('org'),alias:d.get('alias'),contact:d.get('contact'),privacy_ack:true,privacy_version:notice.version});let k=r.key;user=(await api('session')).user;csrf=user.csrf;open('인증키 발급',`<h2>ID와 인증키를 보관해 주세요.</h2><div class="key-box"><span>ID</span><code>${E(r.id)}</code><span>인증키 (이 화면에서만 표시)</span><code>${E(k)}</code></div><p>인증키 분실 시 직접 복구 기능은 아직 마련되지 않았습니다. 분실하지 않도록 보관해 주세요.</p>${button('확인','close')}`);render()})}
function apply(kind='협력 제안',program='사업 미지정',item=null){if(user?.role!=='applicant')return login();const r=item||{};open('협력 신청',`<h2>${kind==='관심 등록'?'사업 관심 등록':kind==='대상 추천'?'협력 대상 추천':'협력 제안하기'}</h2><p>기업·기관·상호명: ${E(user.org)} · 회신 창구 비공개</p><form id="request-form"><div class="form-grid">${select('신청 유형','kind',['협력 제안','관심 등록','대상 추천'],r.kind||kind)}${select('관련 사업','program',['사업 미지정','독서경영','예술로'],r.program||program)}${field('제목','title',r.title||'',{required:true,full:true,max:100})}${select('협력 분야','field',F,r.field||F[1])}${field('희망 시기','timing',r.timing||'')}${field('참여 대상·규모','scale',r.scale||'',{full:true})}<label class="field">추천 대상명 (추천 시 필수)<input name="recommendation" value="${E(r.recommendation||'')}"></label>${field('추천 대상 공식 홈페이지','website',r.website||'',{type:'url'})}${field('비공개 상세·추천 이유','details',r.details||'',{textarea:true,required:true,full:true,max:2000})}${field('함께 제공할 수 있는 자원','resources',r.resources||'',{full:true,max:300})}${field('기대하는 변화','desired',r.desired||'',{textarea:true,full:true,max:600})}<fieldset class="full"><legend>공개 범위 선택</legend><label class="check"><input type="checkbox" name="want_public" id="want-public" ${r.want_public?'checked':''}>총괄 승인 후 공개 게시판에 게시를 요청합니다.</label><label class="check"><input type="checkbox" name="name_public" ${r.name_public?'checked':''}>신청한 기업·기관·상호명 공개</label>${field('공개용 요약 (공개 요청 시 필수)','summary',r.summary||'',{textarea:true,full:true,max:600})}<p class="hint">제목·분야·사업·희망 시기·규모·요약·상태·연결 의사 수가 공개될 수 있습니다. 연락처·비공개 상세는 제외됩니다. 수정하면 공개 승인이 해제됩니다.</p></fieldset></div><p class="hint">대상 추천 시 타인의 개인 연락처를 작성하지 마세요.</p><button class="button">${item?'수정 및 재승인 요청':'제출'}</button></form>`);formHandler('request-form',async d=>{const o=Object.fromEntries(d);o.want_public=d.has('want_public');o.name_public=d.has('name_public');if(item?.id)o.id=item.id;open('제출 전 확인',`<h2>공개 범위를 확인해 주세요.</h2>${o.want_public?`<div class="preview-box"><span class="tag">총괄 승인 후 공개되는 내용</span><h3>${E(o.title)}</h3><small>${o.name_public?E(user.org):'지역 기업·기관·소상공인'} · ${E(o.field)}</small><p>${E(o.summary)}</p><p class="hint">${E(o.program)} · ${E(o.timing||'시기 협의')} · ${E(o.scale||'규모 협의')}</p></div>`:'<div class="notice">비공개 접수입니다. 공개 제안 게시판에 게시되지 않습니다.</div>'}<p class="hint">비공개 상세와 회신 연락처는 표시되지 않습니다. ${item?.id?'수정 시 공개 승인을 다시 받아야 합니다.':''}</p><div class="actions"><button id="submit-confirm" class="button">확인하고 제출</button><button id="submit-back" class="button outline">돌아가 수정</button></div>`);$('#submit-back').onclick=()=>apply(o.kind,o.program,o);$('#submit-confirm').onclick=async e=>{e.currentTarget.disabled=true;try{let v=await api(item?.id?'proposal/update':'proposal',o);close();await navigate('mine');toast(item?.id?'수정했습니다.':'제안이 접수되었습니다: '+v.id)}catch(err){toast(err.message);e.currentTarget.disabled=false}}})}
function match(id){open('직원 매칭 신청',`<h2>연결 의사 등록</h2><p>직원별로 한 번 집계되며 메시지는 총괄만 볼 수 있습니다.</p><form id="match-form"><div class="form-grid">${field('연계 사업','program','',{required:true,full:true})}${field('총괄에게 전달할 내용','message','',{required:true,textarea:true,full:true})}</div><button class="button">총괄에게 전달</button></form>`);formHandler('match-form',async d=>{await api('interest',{id,program:d.get('program'),message:d.get('message')});close();await navigate('board');toast('연결 의사를 등록했습니다.')})}
function note(id){open('협의 기록',`<h2>총괄에게 진행 기록 전달</h2><form id="note-form">${field('협의·실행 내용','body','',{required:true,textarea:true})}<div class="actions"><button class="button">저장</button></div></form>`);formHandler('note-form',async d=>{await api('note',{id,body:d.get('body')});close();await navigate('work');toast('기록을 저장했습니다.')})}
function review(id){const r=payload.items.find(x=>x.id===id);open('총괄 관리',`<h2>${E(r.title)}</h2><p>${E(r.id)} · ${E(r.org)} · ${E(r.alias)}</p><dl class="summary-list"><dt>회신 창구</dt><dd>${E(r.contact)}</dd><dt>비공개 상세</dt><dd>${E(r.details)}</dd><dt>공개 요약</dt><dd>${E(r.summary||'없음')}</dd><dt>공개 표시명</dt><dd>${r.name_public?E(r.org):'지역 기업·기관·소상공인'}</dd></dl><div class="actions">${r.want_public?button(r.approved?'공개 중지':'공개 승인','approve',r.id,'outline'):''}</div><h3>직원 연결 의사</h3>${r.interests.map(i=>`<div class="record"><b>${E(i.alias)}</b> · ${E(i.dept)}<p>${E(i.program)}: ${E(i.message)}</p><button class="button outline small" data-action="assign" data-id="${E(r.id)}" data-staff="${E(i.staff_id)}">${r.assigned.includes(i.staff_id)?'배정 해제':'담당자 배정'}</button></div>`).join('')||'<p>연결 의사가 없습니다.</p>'}<form id="review-form"><div class="form-grid">${select('처리 상태','status',S,r.status)}${field('회신기한','due',r.due,{type:'date'})}${field('다음 조치','next_action',r.next_action,{full:true})}${field('신청자 안내','reply',r.reply,{textarea:true,full:true})}${field('내부 메모','note','',{textarea:true,full:true})}</div><button class="button">진행 현황 저장</button></form>${r.notes.map(n=>`<div class="log-item">${E(n.body)}<small>${E(n.alias)} · ${E(n.created)}</small></div>`).join('')}`);formHandler('review-form',async d=>{await api('admin/update',{id,...Object.fromEntries(d)});close();await navigate('work');toast('저장했습니다.')})}
async function logout(){await api('logout',{});user=null;csrf='';await navigate('home')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(['home','board','mine','work'].includes(a))return await navigate(a);if(a==='close')return close();if(a==='login')return login();if(a==='register')return register();if(a==='logout')return await logout();if(a==='apply')return apply('협력 제안',id||'사업 미지정');if(a==='interest')return apply('관심 등록',id);if(a==='recommend')return apply('대상 추천');if(a==='edit'){const r=payload.items.find(x=>x.id===id);return apply(r.kind,r.program,r)}if(a==='match')return match(id);if(a==='note')return note(id);if(a==='review')return review(id);if(a==='export'){open('월별 공유 목록',`<h2>승인 제안 목록 다운로드</h2><p>공개 승인된 요약만 포함됩니다. 비공개 연락처·상세·직원 메시지는 제외합니다.</p><label class="field">기준 월<input id="export-month" type="month" required></label><div class="actions"><button class="button" data-action="download-csv">CSV 다운로드</button></div>`);$('#export-month').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}).slice(0,7);return}if(a==='download-csv'){const m=$('#export-month').value;if(!/^\d{4}-\d{2}$/.test(m))return toast('기준 월을 확인해 주세요.');window.location.href='/api/admin/export?month='+encodeURIComponent(m);return close()}if(a==='unmatch'){await api('interest/withdraw',{id});await navigate('work');return toast('연결 의사를 철회했습니다.')}if(a==='withdraw'||a==='unpublish'){if(!confirm(a==='withdraw'?'신청을 철회하시겠어요?':'공개 요청을 철회하시겠어요?'))return;await api('proposal/withdraw',{id,withdraw_all:a==='withdraw'});await navigate('mine');return toast('변경했습니다.')}if(a==='approve'){const r=payload.items.find(x=>x.id===id);await api('admin/approval',{id,approved:!r.approved});close();await navigate('work');return toast('공개 상태를 변경했습니다.')}if(a==='assign'){const r=payload.items.find(x=>x.id===id);await api('admin/assign',{id,staff_id:b.dataset.staff,assigned:!r.assigned.includes(b.dataset.staff)});close();await navigate('work');return review(id)}if(a==='staff-toggle'){const s=payload.staff.find(x=>x.id===id);await api('admin/staff',{id,active:!s.active});await navigate('work');return toast('직원 권한을 변경했습니다.')}}catch(err){toast(err.message)}});
(async()=>{try{const s=await api('session');user=s.user;csrf=user?.csrf||'';render()}catch{render();toast('서버에 연결할 수 없습니다.')}})();
</script></body></html>
